spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./content-service/.env[.properties]

  application:
    name: content-service

  datasource:
    url: ${MYSQL_DB_URL:jdbc:mysql://localhost:3307/content_service}
    username: ${MYSQL_DB_USERNAME:root}
    password: ${MYSQL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info

