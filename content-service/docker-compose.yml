services:
  mysql:
    image: mysql:latest
    container_name: content-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_DATABASE: content_service
      MYSQL_USER: ${MYSQL_DB_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - D:\JAVA Spring boot Project\Streamify\content-service\jobportal-data:/var/lib/mysql