services:
  mysql:
    image: mysql:8.4
    container_name: content-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD:-root}
      MYSQL_DATABASE: content_service
    ports:
      - "3307:3306"
    volumes:
      - content-service-mysql-data:/var/lib/mysql

volumes:
  content-service-mysql-data:
